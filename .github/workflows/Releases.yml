name: Releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download YMM4 Lite SDK
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP "YukkuriMovieMaker_v4_Lite.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "YukkuriMovieMaker_v4_Lite"
          $downloadUrl = "https://object-storage.tyo1.conoha.io/v1/nc_4fac3ef0e6d843249e0ab2f1fc3e8f85/public/YukkuriMovieMaker_v4_Lite.zip"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force

          $pluginReference = Get-ChildItem -LiteralPath $extractPath -Filter "YukkuriMovieMaker.Plugin.dll" -File -Recurse | Select-Object -First 1
          if ($null -eq $pluginReference) {
              throw "YukkuriMovieMaker.Plugin.dll がYMM4 Lite SDKに見つかりません。"
          }

          "YMM4_ROOT=$($pluginReference.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build plugin
        shell: pwsh
        run: |
          dotnet build src/YmmSourceControl.Plugin/YmmSourceControl.Plugin.csproj `
            --configuration Release `
            "-p:Ymm4Path=$env:YMM4_ROOT" `
            --output artifacts/plugin

      - name: Package plugin
        shell: pwsh
        run: ./ps1/package-plugin.ps1

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "YMM Source Control ${{ github.ref_name }}" --generate-notes "artifacts/release/YmmSourceControl.ymme"

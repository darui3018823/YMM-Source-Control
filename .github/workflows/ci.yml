name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build preview app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore test project
        run: dotnet restore test/YmmSourceControl.Core.Tests/YmmSourceControl.Core.Tests.csproj

      - name: Run tests
        run: dotnet test test/YmmSourceControl.Core.Tests/YmmSourceControl.Core.Tests.csproj --configuration Release --no-restore --logger trx --results-directory TestResults

      - name: Restore preview app
        run: dotnet restore src/YmmSourceControl.App/YmmSourceControl.App.csproj

      - name: Build preview app
        run: dotnet build src/YmmSourceControl.App/YmmSourceControl.App.csproj --configuration Release --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
